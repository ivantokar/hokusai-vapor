name: CI

on:
  pull_request:
    branches: [main, release/2.0]
  push:
    branches: [main, release/2.0]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cost (hokusai#137): nothing is run twice. A draft pull request skips the build jobs until it is
# marked ready, and a ready one runs Linux only. macOS (the dearest runner, and the one that waits
# for a runner) runs after the merge to main, on a tag, on the weekly schedule and by hand.
# The one required check is `CI complete`: a skipped job counts as passing.

# Hokusai needs libvips 8.16+ and Cairo with PDF support. Linux builds libvips
# with the script Hokusai itself uses, so both packages test the same native
# baseline. Vapor is the released 4.x line from Package.swift.
jobs:
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Linux (Swift 6.4)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      VIPS_PREFIX: /opt/vips
      PKG_CONFIG_PATH: /opt/vips/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/vips/lib
      HOKUSAI_REF: v2.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates xz-utils zstd meson ninja-build pkg-config build-essential \
            libglib2.0-dev libexpat1-dev libjpeg-dev libpng-dev libwebp-dev \
            libtiff-dev libgif-dev libexif-dev liblcms2-dev libcairo2-dev \
            libpango1.0-dev librsvg2-dev libpoppler-glib-dev libheif-dev \
            libarchive-dev libfftw3-dev liborc-0.4-dev fonts-dejavu-core

      - name: Restore libvips build
        uses: actions/cache@v4
        with:
          path: /opt/vips
          key: vips-8.18.7-noble-vapor

      - name: Install libvips 8.18.7
        run: |
          curl -fsSL "https://raw.githubusercontent.com/ivantokar/hokusai/${HOKUSAI_REF}/.github/scripts/install-libvips.sh" -o /tmp/install-libvips.sh
          bash /tmp/install-libvips.sh 8.18.7 "$VIPS_PREFIX"

      - name: Restore SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.swift') }}
          restore-keys: spm-linux-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      # The runtime configuration freezes at first use, so the overload tests (one slot, no queue)
      # run in a process of their own; `swift test` above skips them.
      - name: Overload tests
        run: HOKUSAI_OVERLOAD_TESTS=1 swift test --filter OverloadTests

  macos:
    if: github.event_name != 'pull_request'
    name: macOS (Swift 6.4, Homebrew libvips)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Runner Xcode releases lag swift.org; install the 6.4 toolchain directly.
      - name: Install Swift 6.4
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . ~/.swiftly/env.sh
          swiftly install --use --assume-yes 6.4
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Install libvips and Cairo PDF support
        run: brew install vips cairo pkg-config

      - name: Restore SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-${{ hashFiles('Package.swift') }}
          restore-keys: spm-macos-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      # The runtime configuration freezes at first use, so the overload tests (one slot, no queue)
      # run in a process of their own; `swift test` above skips them.
      - name: Overload tests
        run: HOKUSAI_OVERLOAD_TESTS=1 swift test --filter OverloadTests

  # The one required check. Only success and skipped pass; an "abandoned" job (no runner came)
  # must not count as green.
  complete:
    name: CI complete
    if: always()
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "linux=${{ needs.linux.result }} macos=${{ needs.macos.result }}"
          for result in "${{ needs.linux.result }}" "${{ needs.macos.result }}"; do
            case "$result" in success|skipped) ;; *) echo "not green: $result"; exit 1 ;; esac
          done
